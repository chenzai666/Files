name: 构建内嵌 QuickLook 测试版
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '验证通过后发布的预发布标签（留空则仅构建）'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: embedded-quicklook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: microsoft/setup-msbuild@v3
      - name: 构建隔离预览组件
        shell: pwsh
        run: ./integrations/Build-QuickLookFullHost.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Files-QuickLook-preview-runtime
          path: artifacts/quicklook-full
          if-no-files-found: error
      - name: 构建 Files 原生集成组件
        shell: pwsh
        run: |
          nuget restore src/Files.App.Launcher/Files.App.Launcher.vcxproj -SolutionDirectory ${{ github.workspace }} -Verbosity quiet
          if ($LASTEXITCODE) { throw 'Files.App.Launcher NuGet 还原失败' }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Lib'
          $sdk = Get-ChildItem -LiteralPath $sdkRoot -Directory | Sort-Object Name | Select-Object -Last 1
          if ($null -eq $sdk) { throw "找不到 Windows SDK: $sdkRoot" }
          $sdkVersion = $sdk.Name
          Write-Host "使用 Windows SDK $sdkVersion"
          $projects = @(
            @{ Path = 'src/Files.App.Launcher/Files.App.Launcher.vcxproj'; Platform = 'x64' },
            @{ Path = 'src/Files.App.OpenDialog/Files.App.OpenDialog.vcxproj'; Platform = 'x64' },
            @{ Path = 'src/Files.App.OpenDialog/Files.App.OpenDialog.Win32.vcxproj'; Platform = 'Win32' },
            @{ Path = 'src/Files.App.SaveDialog/Files.App.SaveDialog.vcxproj'; Platform = 'x64' },
            @{ Path = 'src/Files.App.SaveDialog/Files.App.SaveDialog.Win32.vcxproj'; Platform = 'Win32' }
          )
          foreach ($project in $projects) {
            $projectPath = $project.Path
            $projectPlatform = $project.Platform
            msbuild $projectPath -t:Build -p:Configuration=Debug "-p:Platform=$projectPlatform" "-p:WindowsTargetPlatformVersion=$sdkVersion" "-p:TargetPlatformVersion=$sdkVersion" -v:quiet -clp:ErrorsOnly
            if ($LASTEXITCODE) { throw "原生组件构建失败: $projectPath [$projectPlatform]" }
          }
          $required = @(
            'src/Files.App/Assets/FilesOpenDialog/Files.App.Launcher.exe',
            'src/Files.App/Assets/FilesOpenDialog/Files.App.OpenDialog64.dll',
            'src/Files.App/Assets/FilesOpenDialog/Files.App.OpenDialog32.dll',
            'src/Files.App/Assets/FilesOpenDialog/Files.App.SaveDialog64.dll',
            'src/Files.App/Assets/FilesOpenDialog/Files.App.SaveDialog32.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "缺少原生集成组件: $file" }
          }
          Compress-Archive -Path 'src/Files.App/Assets/FilesOpenDialog/Files.App.*' -DestinationPath 'artifacts/native-dialog-components.zip' -Force
      - uses: actions/upload-artifact@v7
        with:
          name: Files-QuickLook-native-dialog-components
          path: artifacts/native-dialog-components.zip
          if-no-files-found: error
      - name: 构建独立测试安装包
        shell: pwsh
        run: |
          msbuild Files.slnx -t:Restore -p:Configuration=Debug -p:Platform=x64 -v:quiet -clp:ErrorsOnly
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild src/Files.App/Files.App.csproj -p:Configuration=Debug -p:Platform=x64 -p:PublishAot=false -p:PublishTrimmed=false -p:AppxBundle=Never -p:GenerateAppxPackageOnBuild=true -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageSigningEnabled=false -p:AppxPackageDir=${{ github.workspace }}\artifacts\packages\ -v:quiet -clp:ErrorsOnly
      - name: 构建单文件 EXE 安装器
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\installer | Out-Null
          ./integrations/New-FilesQuickLookInstaller.ps1 -OutputPath artifacts\installer\Files-QuickLook-Setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: Files-QuickLook-setup-exe
          path: artifacts/installer/Files-QuickLook-Setup.exe
          if-no-files-found: error
      - name: 导出 DEV 主程序集
        shell: pwsh
        run: |
          $assembly = Get-ChildItem -LiteralPath 'src/Files.App/bin' -Recurse -Filter 'Files.dll' -File |
            Where-Object { $_.FullName -notmatch '[\\/]obj[\\/]' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $assembly) { throw '找不到 x64 DEV 主程序集 Files.dll' }
          New-Item -ItemType Directory -Force -Path 'artifacts/main-assembly' | Out-Null
          Copy-Item -LiteralPath $assembly.FullName -Destination 'artifacts/main-assembly/Files.dll' -Force
          Compress-Archive -Path 'artifacts/main-assembly/Files.dll' -DestinationPath 'artifacts/FilesDev-main-assembly.zip' -Force
          Write-Host "已导出: $($assembly.FullName)"
      - uses: actions/upload-artifact@v7
        with:
          name: Files-QuickLook-main-assembly
          path: artifacts/FilesDev-main-assembly.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Files-QuickLook-install-only
          path: artifacts/packages/**/*.msix
          if-no-files-found: error
      - name: 保存对应源码和许可证
        shell: pwsh
        run: |
          git archive HEAD -o artifacts/files-source.zip
          git -C third_party/QuickLook archive HEAD -o ../../artifacts/quicklook-source.zip
          Copy-Item integrations/README.md artifacts/说明.md
      - uses: actions/upload-artifact@v7
        with:
          name: Files-QuickLook-x64-unsigned
          path: |
            artifacts/packages/
            artifacts/files-source.zip
            artifacts/quicklook-source.zip
            artifacts/说明.md
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Files-QuickLook-setup-exe
          path: artifacts/installer
      - name: 验证并发布安装器
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9.]+-quicklook\.[0-9]+$') { throw '无效的版本标签' }
          $exe = 'artifacts/installer/Files-QuickLook-Setup.exe'
          & 'C:\Program Files\7-Zip\7z.exe' t $exe
          if ($LASTEXITCODE) { throw '安装器完整性检查失败' }
          & 'C:\Program Files\7-Zip\7z.exe' x $exe '-oartifacts/verify' 'Install-FilesQuickLook.ps1' -y
          if ($LASTEXITCODE) { throw '无法提取安装脚本' }
          $embedded = (Get-FileHash 'artifacts/verify/Install-FilesQuickLook.ps1').Hash
          if ($embedded -ne (Get-FileHash 'integrations/Install-FilesQuickLook.ps1').Hash) { throw '安装脚本与源码不一致' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash *Files-QuickLook-Setup.exe" | Set-Content "$exe.sha256" -Encoding ascii
          gh release create $env:RELEASE_TAG $exe "$exe.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "Files DEV $env:RELEASE_TAG（持久安装目录修复）" --notes-file integrations/安装目录修复说明.md
          if ($LASTEXITCODE) { throw '发布失败' }
