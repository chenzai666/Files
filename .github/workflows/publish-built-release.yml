name: 发布已构建的 EXE
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'main 分支已成功的构建运行 ID'
        required: true
        type: string
      release_tag:
        description: '发布标签，例如 v4.2.33 或 v4.2.34-rc.1'
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: 验证来源构建
        id: source
        shell: pwsh
        run: |
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw '无效的运行 ID' }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-rc\.\d+)?$') { throw '无效的标签' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw '读取构建失败' }
          if ($run.conclusion -ne 'success' -or $run.head_branch -ne 'main' -or $run.path -ne '.github/workflows/embedded-quicklook.yml' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) { throw '来源必须是本仓库 main 分支成功的 QuickLook 构建' }
          "sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: Files-QuickLook-setup-exe
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/installer
      - name: 验证并发布
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $exe = 'artifacts/installer/Files-QuickLook-Setup.exe'
          7z t $exe
          if ($LASTEXITCODE) { throw '安装器完整性检查失败' }
          7z x $exe '-oartifacts/verify' 'Install-FilesQuickLook.ps1' -y
          if ($LASTEXITCODE) { throw '提取安装脚本失败' }
          if (([IO.File]::ReadAllText('artifacts/verify/Install-FilesQuickLook.ps1').Replace([string][char]13, '')) -cne ([IO.File]::ReadAllText('integrations/Install-FilesQuickLook.ps1').Replace([string][char]13, ''))) { throw '内嵌脚本与来源提交不一致' }
          $namedExe = "artifacts/installer/Files-QuickLook-$env:RELEASE_TAG-x64-Setup.exe"
          Move-Item -LiteralPath $exe -Destination $namedExe
          $exe = $namedExe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash *$(Split-Path $exe -Leaf)" | Set-Content "$exe.sha256" -Encoding ascii
          $notes = Get-Content integrations/安装目录修复说明.md -Raw -Encoding UTF8
          $notes += "`n`n构建来源：main，提交 $env:SOURCE_SHA。`n构建记录：https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN`n`n本版本从已通过的 main 构建发布，与 .6 功能一致，不需要重复安装。`n"
          $notes | Set-Content artifacts/release-notes.md -Encoding utf8
          [string[]]$releaseFlags = if ($env:RELEASE_TAG -match '-rc\.') { @('--prerelease') } else { @('--latest') }
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            if (-not $existing.isDraft) { throw '该版本已公开发布，禁止覆盖' }
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --draft --title "Files QuickLook $env:RELEASE_TAG" --notes-file artifacts/release-notes.md
            if ($LASTEXITCODE) { throw '创建草稿失败' }
          }
          $releaseId = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json databaseId --jq '.databaseId'
          if ($LASTEXITCODE) { throw '读取草稿 ID 失败' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" | ConvertFrom-Json
          if ($LASTEXITCODE -or -not $release.draft) { throw '无法确认发布草稿' }
          foreach ($file in @($exe, "$exe.sha256")) {
            $name = Split-Path $file -Leaf
            foreach ($asset in @($release.assets | Where-Object name -eq $name)) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
              if ($LASTEXITCODE) { throw '清理草稿附件失败' }
            }
            $url = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=$([Uri]::EscapeDataString($name))"
            curl --http1.1 --fail-with-body --connect-timeout 20 --max-time 300 --request POST --header "Authorization: Bearer $env:GH_TOKEN" --header 'Content-Type: application/octet-stream' --data-binary "@$file" --output artifacts/upload-response.json --write-out 'HTTP=%{http_code} uploaded=%{size_upload} speed=%{speed_upload}\n' $url
            if ($LASTEXITCODE) { throw "上传失败: $name" }
            $uploaded = Get-Content artifacts/upload-response.json -Raw | ConvertFrom-Json
            $expectedDigest = 'sha256:' + (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($uploaded.size -ne (Get-Item $file).Length -or $uploaded.digest -ne $expectedDigest) { throw '远端附件校验失败' }
          }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false @releaseFlags --title "Files QuickLook $env:RELEASE_TAG" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE) { throw '发布失败' }
